name: Bot Status & Deployment Notifier

on:
  push:
    branches: [ "main", "master" ]

jobs:
  notify-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & Test syntax
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ Kiểm tra cú pháp mã nguồn thành công!"

      - name: Send Rich Embed Notification to Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" == "success" ]; then
            COLOR="3066993" # Xanh lá
            TITLE="✅ Cập Nhật Mã Nguồn Bot Thành Công!"
            DESC="Hệ thống đã kiểm tra mã nguồn và sẵn sàng vận hành."
          else
            COLOR="15158332" # Đỏ
            TITLE="❌ Lỗi Cập Nhật Mã Nguồn Bot!"
            DESC="Phát hiện lỗi cú pháp hoặc lỗi trong quá trình cài đặt thư viện."
          fi

          PAYLOAD=$(jq -n \
            --arg username "Trạm Quản Trị Bot" \
            --arg title "$TITLE" \
            --arg desc "$DESC" \
            --arg commit "${{ github.event.head_commit.message }}" \
            --arg author "${{ github.actor }}" \
            --arg repo "${{ github.repository }}" \
            --arg color "$COLOR" \
            '{
              username: $username,
              embeds: [{
                title: $title,
                description: $desc,
                color: ($color | tonumber),
                fields: [
                  {name: "📂 Kho lưu trữ", value: $repo, inline: true},
                  {name: "👤 Tác giả", value: $author, inline: true},
                  {name: "💬 Nội dung Commit", value: $commit, inline: false}
                ],
                footer: {text: "Hệ thống tự động hóa GitHub Actions"}
              }]
            }')

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               $DISCORD_WEBHOOK_URL
               
