name: Bot Status & Lifecycle Notifier

on:
  push:
    branches: [ "main", "master" ]
  repository_dispatch:
    types: [bot-status] # Lắng nghe tín hiệu bật/tắt từ điện thoại

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Lifecycle Notification to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Kiểm tra xem sự kiện kích hoạt là gì (Push code hay tín hiệu từ Bot)
          EVENT_TYPE="${{ github.event_name }}"
          
          if [ "$EVENT_TYPE" == "push" ]; then
            TITLE="✅ Cập Nhật Mã Nguồn Bot!"
            DESC="Đã đẩy code mới lên kho lưu trữ GitHub."
            COLOR="3066993" # Xanh lá
            AUTHOR="${{ github.actor }}"
            DETAIL="Commit: ${{ github.event.head_commit.message }}"
          elif [ "$EVENT_TYPE" == "repository_dispatch" ]; then
            # Lấy trạng thái (online/offline) do điện thoại gửi lên
            STATUS_MSG="${{ github.event.client_payload.status }}"
            if [ "$STATUS_MSG" == "ONLINE" ]; then
              TITLE="🟢 Bot Đã Trực Tuyến (Online)!"
              DESC="Bot trên điện thoại đã khởi động và sẵn sàng hoạt động."
              COLOR="5763719" # Xanh lá sáng
            else
              TITLE="🔴 Bot Đã Ngoại Tuyến (Offline)!"
              DESC="Bot trên điện thoại đã bị tắt hoặc mất kết nối."
              COLOR="15548997" # Đỏ
            fi
            AUTHOR="Điện Thoại (Termux)"
            DETAIL="Trạng thái hệ thống thay đổi."
          fi

          # Gửi tin nhắn qua Webhook
          PAYLOAD=$(jq -n \
            --arg username "Trạm Trạng Thái Bot" \
            --arg title "$TITLE" \
            --arg desc "$DESC" \
            --arg author "$AUTHOR" \
            --arg detail "$DETAIL" \
            --arg color "$COLOR" \
            '{
              username: $username,
              embeds: [{
                title: $title,
                description: $desc,
                color: ($color | tonumber),
                fields: [
                  {name: "👤 Nguồn kích hoạt", value: $author, inline: true},
                  {name: "📌 Chi tiết", value: $detail, inline: false}
                ],
                footer: {text: "Hệ thống tự động hóa GitHub Actions"}
              }]
            }')

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               $DISCORD_WEBHOOK_URL
               
